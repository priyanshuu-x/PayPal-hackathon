# Weekly update PRs for every ecosystem we ship. Review each one: dependencies that parse
# untrusted input (Pillow, pypdf, python-multipart, Starlette) matter most.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

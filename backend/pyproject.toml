[project]
name = "proofcheck-backend"
version = "0.1.0"
description = "ProofCheck backend: checks refund and dispute evidence against PayPal records"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.162.0",
    "starlette==1.10.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.7.0",
    "httpx==0.28.1",
    "psycopg2-binary==2.9.13",  # Postgres driver for SQLModel on Render
    "sqlmodel==0.0.22",
    "python-multipart==0.0.33",
    "pillow==13.0.0",
    "pypdf==6.21.4",
    "rapidfuzz==3.14.6",
    "pypdfium2==4.30.0",
    "render==1.7.0",
    "langchain==1.4.8",
    "langchain-core==1.7.4",
    "langchain-groq==1.1.3",
    "requests==2.34.2",  # used by the PayPal Agent Toolkit
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "respx==0.22.0",
    "ruff==0.8.4",
    "pytest-cov==7.1.0",
    "mypy==1.14.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# Strict on the security-critical modules listed in CLAUDE.md "Conventions".
[[tool.mypy.overrides]]
module = ["app.verify.*", "app.security.*", "app.drafting.grounding", "app.copilot.toolkit"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true
